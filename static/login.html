<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunnelIQ — Sign in</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="/static/app.js"></script>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form" novalidate>
    <h1>FunnelIQ</h1>
    <p class="sub">Northbound Media · internal tool. Sign in with your team account.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="primary" id="submit" type="submit">Sign in</button>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
  </form>
</div>
<script>
  (async () => {
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const submit = document.getElementById("submit");

    // Already signed in? Go straight to the dashboard.
    try {
      const session = await FunnelIQ.getSession();
      if (session) { window.location.replace("/static/dashboard.html"); return; }
    } catch (e) {
      errorBox.textContent = e.message;
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      errorBox.textContent = "";
      submit.disabled = true;
      try {
        await FunnelIQ.signIn(form.email.value.trim(), form.password.value);
        window.location.replace("/static/dashboard.html");
      } catch (e) {
        errorBox.textContent = e.message || "Sign-in failed";
        submit.disabled = false;
      }
    });
  })();
</script>
</body>
</html>

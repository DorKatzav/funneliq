line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI idiom: Depends()/Query() in defaults are declarations, not calls
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[lint.per-file-ignores]
# prose strings for the generated FINDINGS.md / REPORT.md §P6
"ml/eda.py" = ["E501"]
"ml/simulator.py" = ["E501"]
# trainers and the live smoke script print long human-readable lines
"ml/train_*.py" = ["E501"]
"scripts/smoke_live.py" = ["E501"]
